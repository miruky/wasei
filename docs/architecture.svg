<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" role="img" aria-labelledby="arch-title">
  <title id="arch-title">waseiの構成。純粋な楽理モジュールが構成音・ボイシング・ローマ数字を計算し、画面(app)と発音(engine)がそれを使う。画面の進行はengineで音になり、URLハッシュとlocalStorageへ保存・復元される。</title>
  <style>
    .box { fill: #ffffff; stroke: #e7e1d4; stroke-width: 1.5; }
    .mod { fill: #faf7f0; stroke: #d6cebd; stroke-width: 1.5; }
    .name { fill: #1f1c17; font: 600 15px system-ui, sans-serif; }
    .label { fill: #6f6a60; font: 12.5px system-ui, sans-serif; }
    .sig { stroke: #4a51d0; stroke-width: 2; fill: none; marker-end: url(#a); }
    .ctl { stroke: #9b9485; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#b); }
    .bi { marker-start: url(#a); }
    #a path { fill: #4a51d0; }
    #b path { fill: #9b9485; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #221f18; stroke: #2f2a21; }
      .mod { fill: #1d1b15; stroke: #3e382c; }
      .name { fill: #ece7da; }
      .label { fill: #9c9485; }
      .sig { stroke: #9aa0ff; }
      #a path { fill: #9aa0ff; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" />
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" />
    </marker>
  </defs>

  <rect class="mod" x="40" y="70" width="210" height="212" rx="14" />
  <text class="name" x="145" y="98" text-anchor="middle">楽理(純粋関数)</text>
  <text class="label" x="145" y="130" text-anchor="middle">notes ・ chords</text>
  <text class="label" x="145" y="156" text-anchor="middle">circle(五度圏)</text>
  <text class="label" x="145" y="182" text-anchor="middle">voicing</text>
  <text class="label" x="145" y="208" text-anchor="middle">progression</text>
  <text class="label" x="145" y="234" text-anchor="middle">arp</text>
  <text class="label" x="145" y="260" text-anchor="middle">share</text>

  <rect class="box" x="330" y="112" width="190" height="104" rx="14" />
  <text class="name" x="425" y="148" text-anchor="middle">app.ts(画面)</text>
  <text class="label" x="425" y="172" text-anchor="middle">五度圏 ・ 進行エディタ</text>
  <text class="label" x="425" y="192" text-anchor="middle">トランスポート</text>

  <rect class="box" x="600" y="112" width="170" height="104" rx="14" />
  <text class="name" x="685" y="148" text-anchor="middle">engine.ts</text>
  <text class="label" x="685" y="172" text-anchor="middle">Web Audio</text>
  <text class="label" x="685" y="192" text-anchor="middle">発音・予約</text>

  <rect class="box" x="838" y="134" width="84" height="60" rx="14" />
  <text class="name" x="880" y="169" text-anchor="middle">出力</text>

  <rect class="mod" x="330" y="252" width="190" height="62" rx="14" />
  <text class="name" x="425" y="280" text-anchor="middle">永続化</text>
  <text class="label" x="425" y="300" text-anchor="middle">URLハッシュ / localStorage</text>

  <path class="sig" d="M250 164 H322" />
  <text class="label" x="286" y="152" text-anchor="middle">構成音</text>
  <path class="sig" d="M520 164 H592" />
  <text class="label" x="556" y="152" text-anchor="middle">進行・テンポ</text>
  <path class="sig" d="M770 164 H830" />

  <path class="ctl" d="M250 104 C 372 54, 542 54, 660 110" />
  <text class="label" x="455" y="50" text-anchor="middle">ボイシング・刻み</text>

  <path class="sig bi" d="M425 216 V248" />
  <text class="label" x="500" y="238" text-anchor="middle">共有・復元</text>
</svg>
